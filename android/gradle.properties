# Memory settings are sized for the machine this project is built on:
# 8 GB physical (~7.9 GB visible to Windows), 4 cores / 8 threads.
#
# The previous value asked one JVM for -Xmx8G — the entire machine's RAM —
# plus a 4 GB metaspace cap and a 512 MB code cache. G1 sizes the committed
# heap against -Xmx, not against what the build actually uses, so it grew to
# ~4.3 GB committed while the live set never exceeded ~700 MB, and metaspace
# never passed 212 MB. `flutter build apk` then died 68 minutes in when a
# 1.45 GB G1 region commit failed with 649 MB physical free and 1.4 GB of
# commit charge left (see the JVM crash log the run left behind). It is
# reported as "Gradle build daemon disappeared unexpectedly", which looks
# like a Gradle bug but is a plain out-of-memory abort.
#
# 3 GB is ~4x the observed peak and still leaves room for everything that
# runs beside the daemon: the Kotlin compile daemon, the Dart frontend
# server, aapt2 and d8. The free-ratio bounds let G1 hand committed pages
# back after a spike instead of squatting on them for the rest of the build.
# ParallelGCThreads matches the 4 physical cores rather than 8 hyperthreads.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:ParallelGCThreads=4 -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compile daemon is a *second* JVM, and when this is unset the
# Kotlin Gradle plugin starts it with the Gradle daemon's jvmargs. Under the
# old setting that meant two JVMs on this box each entitled to an 8 GB heap.
# Capped explicitly so it stays independent of the value above.
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m

# Each worker is a process that wants its own heap. Eight logical cores are
# available, but three concurrent workers is what 8 GB holds without pushing
# the whole build into the page file — which is what made the failed run take
# 68 minutes before it crashed.
org.gradle.workers.max=3

# The daemon's default idle timeout is 3 hours; on a RAM-constrained machine
# that is a multi-gigabyte process sitting on memory long after the build.
org.gradle.daemon.idletimeout=1800000

# Unchanged modules come from the build cache instead of being recompiled.
# Matters here because kotlin.incremental is off (below).
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Explicitly false: android.builtInKotlin=true requires Flutter >=3.47
# (per Flutter's own migration docs), and this project's SDK is older.
# On this version, the Flutter Gradle plugin unconditionally
# force-applies the legacy kotlin-android plugin to every Android plugin
# module that doesn't declare Kotlin itself (flutter_local_notifications,
# sqflite_android, jni, jni_flutter, flutter_plugin_android_lifecycle —
# none of them have Kotlin sources) — see detectApplyingKotlinGradlePlugin
# in flutter_tools/gradle/src/main/kotlin/FlutterPluginUtils.kt. With
# builtInKotlin=true, AGP9 refuses that forced legacy plugin outright,
# breaking every one of those modules. With it false (the version-correct
# default here), that same force-apply mechanism is what makes them build
# at all, and file_picker is vendored (vendor/file_picker_agp9) to apply
# its own Kotlin plugin unconditionally too instead of assuming built-in
# Kotlin is active. Safe to flip back to true (and drop that vendor
# override) once the project's Flutter SDK is upgraded to >=3.47.
android.builtInKotlin=false
kotlin.incremental=false
