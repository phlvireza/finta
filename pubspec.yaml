name: finta
description: "Finta — Personal Financial Tracking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database & Storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # State Management
  provider: ^6.1.4

  # Charts
  fl_chart: ^0.70.2

  # UI
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.2
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.2
  table_calendar: ^3.2.0

  # Backup, restore & import
  share_plus: ^10.1.4
  file_picker: ^11.0.3
  archive: ^3.6.1
  csv: ^6.0.0

  # Bill reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# file_picker 11.0.3's Android build skips applying the legacy
# kotlin-android plugin under AGP 9, trusting AGP's built-in Kotlin
# compiler instead — but android.builtInKotlin=true isn't safe on this
# project's Flutter SDK (<3.47; see android/gradle.properties). Points at
# a local copy with that AGP9 skip removed, so it applies kotlin-android
# unconditionally like every other plugin here. Only
# vendor/file_picker_agp9/android/build.gradle differs from the published
# 11.0.3 package. Drop this override once the Flutter SDK is upgraded to
# >=3.47 and android.builtInKotlin=true is turned back on project-wide.
dependency_overrides:
  file_picker:
    path: vendor/file_picker_agp9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
